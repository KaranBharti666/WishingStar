<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WishingStar ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Playfair+Display:wght@700&family=DM+Sans&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:DM Sans;color:#351a25;padding:18px;transition:.4s}
.rose{background:linear-gradient(180deg,#fff7fa,#ffe5ee)}.lavender{background:linear-gradient(180deg,#faf7ff,#eee5ff)}.midnight{background:linear-gradient(180deg,#17172a,#2b1834);color:#fff}.sunset{background:linear-gradient(180deg,#fff8f2,#ffdce3)}.classic{background:#f7f4ef}
.wrap{max-width:760px;margin:auto}.hero{text-align:center;padding:28px 8px 20px}.logo{font:600 34px Caveat;color:#d83f6c}.heart{font-size:52px;animation:beat 2s infinite}.eyebrow{font-weight:700;font-size:20px;margin:14px auto 8px;max-width:650px}.sub{font-size:18px;line-height:1.7;color:#765964;margin:0 auto 24px}.midnight .sub{color:#ddd}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:16px}.tile{background:#ffffffd9;border:1px solid #fff;border-radius:22px;padding:30px 14px;min-height:165px;box-shadow:0 12px 35px #7b304512;cursor:pointer;text-align:center;color:#4b1727;transition:.2s}.tile:active{transform:scale(.98)}.icon{font-size:42px}.tile h2{font:400 24px DM Sans;margin:12px 0 0}.midnight .tile{background:#19192bdd;color:#fff;border-color:#ffffff22}
.panel{display:none;margin-top:18px;background:#ffffffea;border-radius:25px;padding:22px;box-shadow:0 15px 45px #7b304520}.panel.active{display:block}.panel h2{font:700 30px Playfair Display;margin:0 0 14px;color:#5d172b}.midnight .panel{background:#19192bdd}.midnight .panel h2{color:#fff}.close{float:right;border:0;background:#fff0f5;color:#a62d55;border-radius:99px;padding:8px 14px;font-weight:700}.letter{white-space:pre-wrap;line-height:1.9;font-size:17px;color:#66545d}.midnight .letter{color:#ddd}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:17px}.datebox{text-align:center;padding:25px;font-size:22px}.datebig{font:600 38px Caveat;color:#ff4f81}.music{margin:20px auto;text-align:center}.music button{border:0;border-radius:99px;padding:13px 22px;background:#ff4f81;color:#fff;font-weight:700}.from{text-align:center;margin:24px 0;color:#9b7884}.proposal{margin-top:22px;text-align:center}.proposal h2{font:600 31px Caveat}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.actions button{padding:12px 22px;border:0;border-radius:99px;font-weight:700}.yes{background:#ff4f81;color:#fff}.no{background:#fff0f5;color:#b72e58}.error{display:none;text-align:center;padding:24px;background:#fff0f0;border-radius:20px;color:#9f2947}.spark{position:fixed;pointer-events:none;animation:fall 1.7s ease-out forwards;font-size:24px}@keyframes beat{50%{transform:scale(1.08)}}@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
@media(max-width:520px){body{padding:10px}.menu{gap:12px}.tile{min-height:145px;padding:24px 8px}.tile h2{font-size:20px}.eyebrow{font-size:18px}.sub{font-size:16px}.gallery{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
<div class="logo">WishingStar ✦</div>
<div class="heart">💗</div>
<div class="eyebrow" id="eyebrow">A little surprise made just for you</div>
<p class="sub">Explore the little things I love about us.</p>
</section>
<div id="error" class="error"></div>
<section class="menu" id="menu" style="display:none">
<button class="tile" type="button" data-panel="memories"><div class="icon">🖼️</div><h2>Our<br>Memories</h2></button>
<button class="tile" type="button" data-panel="letter"><div class="icon">✉️</div><h2>My Letter</h2></button>
<button class="tile" type="button" data-panel="love"><div class="icon">♡</div><h2>Why I Love<br>You</h2></button>
<button class="tile" type="button" data-panel="date"><div class="icon">♡<small style="display:block;font-size:24px;margin-top:-17px">▣</small></div><h2>Date Night?</h2></button>
</section>
<section class="panel" id="memories"><button class="close" type="button">Back</button><h2>Our Memories</h2><div class="gallery" id="gallery"></div><p id="noPhotos" style="text-align:center;color:#987681">No photos were added to this surprise.</p></section>
<section class="panel" id="letter"><button class="close" type="button">Back</button><h2>My Letter</h2><div class="letter" id="letterText"></div></section>
<section class="panel" id="love"><button class="close" type="button">Back</button><h2>Why I Love You</h2><div class="letter" id="loveText"></div></section>
<section class="panel" id="date"><button class="close" type="button">Back</button><h2>Date Night?</h2><div class="datebox"><div>Our special date</div><div class="datebig" id="dateText">Whenever we're together ❤️</div></div></section>
<div class="music" id="music"></div>
<div class="from" id="from"></div>
<div class="proposal" id="proposal"></div>
</main>
<script>
const id=location.pathname.split("/").filter(Boolean).pop();
const $=id=>document.getElementById(id);
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function openPanel(name){document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));$(name).classList.add("active");window.scrollTo({top:document.getElementById(name).offsetTop-10,behavior:"smooth"})}
document.querySelectorAll(".tile").forEach(b=>b.addEventListener("click",()=>openPanel(b.dataset.panel)));
document.querySelectorAll(".close").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));window.scrollTo({top:0,behavior:"smooth"})}));
async function load(){
try{
const r=await fetch("/api/pages/"+encodeURIComponent(id),{cache:"no-store"});
if(!r.ok)throw new Error("not found");
const p=await r.json();
document.body.className=p.theme||"rose";
document.title=(p.title||"WishingStar")+" ✦";
$("eyebrow").textContent=p.title||"A little surprise made just for you";
$("letterText").textContent=p.message||"";
$("loveText").textContent=p.loveText||"";
$("from").textContent=p.sender?"With love, "+p.sender:"";
if(p.date)$("dateText").textContent=new Date(p.date+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"});
const photos=p.photos||[];
$("gallery").innerHTML=photos.map(x=>'<img src="'+x+'" alt="Memory">').join("");
$("noPhotos").style.display=photos.length?"none":"block";
if(p.musicUrl){
const u=p.musicUrl.trim(),box=$("music");
if(/youtu\.be|youtube\.com/i.test(u)){const m=u.match(/[?&]v=([^&]+)/)||u.match(/youtu\.be\/([^?]+)/);if(m)box.innerHTML='<iframe width="100%" height="90" src="https://www.youtube.com/embed/'+m[1]+'?autoplay=1" allow="autoplay; encrypted-media" style="border:0;border-radius:16px"></iframe>'}
else if(/spotify\.com/i.test(u)){const m=u.match(/spotify\.com\/(track|album|playlist)\/([A-Za-z0-9]+)/);if(m)box.innerHTML='<iframe src="https://open.spotify.com/embed/'+m[1]+'/'+m[2]+'" width="100%" height="152" frameborder="0" allow="autoplay; clipboard-write; encrypted-media" style="border:0;border-radius:16px"></iframe>'}
else{const a=new Audio(u);a.loop=true;const b=document.createElement("button");b.className="music";b.textContent="▶ Play music";b.onclick=()=>a.play();box.appendChild(b)}
}
if(p.type==="proposal")$("proposal").innerHTML='<h2>'+esc(p.proposalQuestion||"Will you be mine forever?")+'</h2><div class="actions"><button class="yes" id="yesBtn">'+esc(p.yesText||"Yes ❤️")+'</button><button class="no" id="noBtn">'+esc(p.noText||"Maybe 🙈")+'</button></div>';
if(p.type==="proposal"){document.getElementById("yesBtn").onclick=celebrate;document.getElementById("noBtn").onclick=moveNo}
$("menu").style.display="grid";
}catch(e){console.error(e);$("error").style.display="block";$("error").innerHTML="<b>This surprise could not be loaded.</b><br>Please open the link again in Chrome."}
}
function moveNo(){const b=$("noBtn");b.style.transform="translate("+((Math.random()*140)-70)+"px,"+((Math.random()*80)-40)+"px)"}
function celebrate(){for(let i=0;i<30;i++){const e=document.createElement("span");e.className="spark";e.textContent=["💖","✨","💕","🌸"][i%4];e.style.left=Math.random()*100+"vw";e.style.top="-20px";e.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}$("proposal").innerHTML="<h2>Yay! 💖✨</h2><p>You've just made this moment unforgettable.</p>"}
load();
</script>
</body>
</html>
