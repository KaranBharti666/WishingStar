<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>WishingStar ✦</title><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Playfair+Display:wght@700&family=DM+Sans&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#ffdce8,#fff6f9 45%,#ffe9f1);font-family:DM Sans;color:#291820;padding:20px}.card{max-width:680px;width:100%;background:#ffffffdf;backdrop-filter:blur(12px);border:1px solid #fff;border-radius:32px;padding:40px 25px;text-align:center;box-shadow:0 25px 80px #7d28451c}.heart{font-size:55px;animation:f 2s infinite}.title{font:700 42px Playfair Display}.name{font:600 34px Caveat;color:#ff4f81}.msg{white-space:pre-wrap;line-height:1.9;color:#66545d;font-size:17px}.from{margin-top:25px;color:#9b7884}@keyframes f{50%{transform:translateY(-7px) scale(1.05)}}</style><main class="card"><div class="heart">💗</div><div class="title" id="title">Loading...</div><div class="name" id="name"></div><p class="msg" id="msg"></p><div id="date"></div><div class="from" id="from"></div></main><script>const id=location.pathname.split("/").pop();fetch("/api/pages/"+id).then(r=>r.json()).then(p=>{document.title=(p.title||"WishingStar")+" ✦";title.textContent=p.title||"A little surprise for you";name.textContent=p.recipient||"";msg.textContent=p.message||"";date.textContent=p.date?"✦ "+p.date:"";from.textContent=p.sender?"With love, "+p.sender:""}).catch(()=>title.textContent="This surprise could not be found 💔")</script>
