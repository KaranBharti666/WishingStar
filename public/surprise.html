<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>WishingStar ✦</title><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Playfair+Display:wght@700&family=DM+Sans&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:DM Sans;color:#291820;padding:18px;transition:.5s}.card{max-width:760px;width:100%;background:#ffffffdd;backdrop-filter:blur(14px);border:1px solid #fff;border-radius:32px;padding:38px 24px;text-align:center;box-shadow:0 25px 80px #7d28451c;position:relative;overflow:hidden}.rose{background:radial-gradient(circle at 20% 10%,#ffd5e4,#fff6f9 48%,#ffe7f0)}.lavender{background:radial-gradient(circle at 20% 10%,#e9dcff,#faf7ff 48%,#eee6ff)}.midnight{background:radial-gradient(circle at 20% 10%,#20203c,#111326 48%,#30213f);color:#fff}.midnight .card{background:#16172ddd;color:#fff}.sunset{background:radial-gradient(circle at 20% 10%,#ffd2bd,#fff5ee 48%,#ffd8df)}.classic{background:#f7f4ef}.heart{font-size:58px;animation:f 2s infinite}.title{font:700 clamp(30px,6vw,46px) Playfair Display}.name{font:600 37px Caveat;color:#ff4f81}.msg{white-space:pre-wrap;line-height:1.9;color:#66545d;font-size:17px}.midnight .msg{color:#ddd}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:22px 0}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;box-shadow:0 8px 20px #0001}.music{margin:22px auto;max-width:560px}.from{margin-top:25px;color:#9b7884}.proposal{margin:25px auto 5px;max-width:540px}.proposal h2{font:600 31px Caveat}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.actions button{padding:12px 22px;border:0;border-radius:99px;font-weight:bold;cursor:pointer}.yes{background:#ff4f81;color:#fff}.no{background:#fff0f5;color:#b72e58}@keyframes f{50%{transform:translateY(-7px) scale(1.06)}}.spark{position:fixed;pointer-events:none;animation:fall 1.7s ease-out forwards;font-size:24px}@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}</style></head><body><main class="card"><div class="heart">💗</div><div class="title" id="title">Loading...</div><div class="name" id="name"></div><div class="gallery" id="gallery"></div><p class="msg" id="msg"></p><div id="date"></div><div id="proposal"></div><div class="from" id="from"></div></main><script>const id=location.pathname.split("/").pop();fetch("/api/pages/"+id).then(r=>r.json()).then(p=>{document.body.className=p.theme||"rose";document.title=(p.title||"WishingStar")+" ✦";title.textContent=p.title||"A little surprise for you";name.textContent=p.recipient||"";msg.textContent=p.message||"";date.textContent=p.date?"✦ "+p.date:"";from.textContent=p.sender?"With love, "+p.sender:"";gallery.innerHTML=(p.photos||[]).map(x=>'<img src="'+x+'">').join("");if(p.musicUrl){const a=new Audio(p.musicUrl);a.loop=true;document.body.addEventListener("click",()=>a.play().catch(()=>{}),{once:true})}if(p.type==="proposal"){proposal.innerHTML='<section class="proposal"><h2>'+esc(p.proposalQuestion||"Will you be mine forever?")+'</h2><div class="actions"><button class="yes" onclick="celebrate()">'+esc(p.yesText||"Yes ❤️")+'</button><button class="no" id="no" onclick="moveNo()">'+esc(p.noText||"Maybe 🙈")+'</button></div></section>'}}).catch(()=>title.textContent="This surprise could not be found 💔");function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}function moveNo(){const b=document.getElementById("no");b.style.transform='translate('+((Math.random()*140)-70)+'px,'+((Math.random()*80)-40)+'px)'}function celebrate(){for(let i=0;i<30;i++){const e=document.createElement("span");e.className="spark";e.textContent=["💖","✨","💕","🌸"][i%4];e.style.left=Math.random()*100+"vw";e.style.top="-20px";e.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}document.querySelector(".proposal").innerHTML="<h2>Yay! 💖✨</h2><p>You've just made this moment unforgettable.</p>"}</script></body></html>
