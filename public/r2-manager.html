<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>R2 File Manager</title><style>body{font-family:Arial;background:#fff7fa;margin:0;padding:24px;color:#291820}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between}.logo{font-size:30px;font-weight:bold;color:#ff4f81}.tools{display:flex;gap:10px;margin:20px 0}.tools input{flex:1;padding:12px;border:1px solid #ead6de;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #efdce3;border-radius:18px;overflow:hidden}.preview{height:180px;background:#f8edf1;display:grid;place-items:center}.preview img,.preview video{width:100%;height:100%;object-fit:cover}.body{padding:14px}.key{font-size:13px;word-break:break-all}.meta{font-size:12px;color:#806772;margin-top:7px}.btn{display:inline-block;margin-top:10px;margin-right:6px;padding:8px 10px;border-radius:9px;background:#ffe8f0;color:#a52c56;text-decoration:none;border:0}.empty{padding:50px;text-align:center;background:#fff;border-radius:18px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div class="logo">WishingStar ✦</div><a href="/dashboard.html">← Dashboard</a></div><h1>R2 File Manager ☁️</h1><p>Files stored in your Cloudflare R2 bucket.</p><div class="tools"><input id="q" placeholder="Search files..."></div><div id="grid" class="grid"></div></main><script>
let files=[];
const q=document.getElementById("q"),grid=document.getElementById("grid");
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const type=f=>/\.(jpg|jpeg|png|gif|webp|avif|bmp|svg)$/i.test(f.key)?"image":/\.(mp4|webm|mov|m4v|avi|mkv)$/i.test(f.key)?"video":/\.(mp3|wav|m4a|aac|ogg|flac)$/i.test(f.key)?"audio":"other";
const size=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":n<1073741824?(n/1048576).toFixed(1)+" MB":(n/1073741824).toFixed(2)+" GB";
function render(){const x=files.filter(f=>!q.value||f.key.toLowerCase().includes(q.value.toLowerCase()));grid.innerHTML=x.length?x.map(f=>{const t=type(f);let p=t==="image"?'<img src="'+f.url+'">':t==="video"?'<video src="'+f.url+'" controls></video>':t==="audio"?'<audio src="'+f.url+'" controls></audio>':'📄';return '<article class="card"><div class="preview">'+p+'</div><div class="body"><div class="key">'+esc(f.key)+'</div><div class="meta">'+size(f.size)+'</div><a class="btn" href="'+f.url+'" target="_blank">Open</a><button class="btn" onclick="copyUrl('+JSON.stringify(f.url)+')">Copy URL</button></div></article>'}).join(""):'<div class="empty" style="grid-column:1/-1">No R2 files found.</div>'}
async function copyUrl(u){try{await navigator.clipboard.writeText(u);alert("URL copied")}catch(e){prompt("Copy URL:",u)}}
const adminToken=()=>localStorage.getItem("wishingstar_admin_token")||"";
async function load(){const r=await fetch("/api/r2/files",{headers:{"X-Admin-Token":adminToken()}}),j=await r.json();if(r.status===401){location.href="/admin.html";return}if(!r.ok)throw Error(j.error||"Unable to load R2 files");files=j.files||[];render()}
q.oninput=render;load().catch(e=>grid.innerHTML='<div class="empty" style="grid-column:1/-1">'+esc(e.message)+'</div>');
</script></body></html>
