<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>WishingStar ✦</title><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Playfair+Display:wght@700&family=DM+Sans&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff5f8,#ffe8f0);color:#291820;font-family:DM Sans;padding:20px}.logo{font:600 34px Caveat;color:#ff4f81}main{max-width:1050px;margin:auto}.hero{text-align:center;padding:35px 10px}.hero h1{font:700 52px Playfair Display;margin:10px}.hero p{color:#765f68}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;padding:24px;border-radius:24px;box-shadow:0 15px 45px #7b304018}input,textarea,select{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #ead6de;border-radius:12px;font:inherit}textarea{min-height:120px}button{padding:12px 17px;border:0;border-radius:12px;font-weight:bold;cursor:pointer}.primary{background:#ff4f81;color:#fff}.secondary{background:#fff0f5;color:#b72e58}.preview{min-height:500px;text-align:center;background:#fff7fa}.heart{font-size:45px}.pvtitle{font:700 30px Playfair Display}.name{font:600 27px Caveat;color:#ff4f81}.msg{white-space:pre-wrap;line-height:1.7;color:#6c5861}.result{display:none;margin-top:15px;padding:15px;background:#fff0f5;border-radius:15px}.qr{width:180px}@media(max-width:750px){.grid{grid-template-columns:1fr}.hero h1{font-size:40px}}</style><body><main><div class="logo">WishingStar ✦</div><div class="hero"><h1>Make a wish <span style="color:#ff4f81">unforgettable.</span></h1><p>Create a personalised birthday, proposal, Valentine or anniversary surprise and share it with one beautiful link.</p><a href="/dashboard.html">My Dashboard</a></div><div class="grid"><section class="card"><h2>Create your surprise</h2><label>Occasion</label><select id="type"><option value="birthday">🎂 Birthday</option><option value="proposal">💍 Proposal</option><option value="valentine">❤️ Valentine</option><option value="anniversary">🥂 Anniversary</option><option value="custom">✨ Custom</option></select><label>Recipient</label><input id="recipient" placeholder="Their name"><label>Your name</label><input id="sender" placeholder="Your name"><label>Title</label><input id="title" placeholder="Happy Birthday, my favourite person ❤️"><label>Message</label><textarea id="message" placeholder="Write something from your heart..."></textarea><label>Date</label><input id="date" type="date"><label>Music URL (optional)</label><input id="musicUrl" placeholder="https://..."><button class="primary" onclick="create()">Create WishingStar ✨</button><div id="result" class="result"></div></section><section class="card preview"><h2>Live preview</h2><div class="heart">💗</div><div class="pvtitle" id="ptitle">Your beautiful surprise</div><div class="name" id="pname">Someone special</div><p class="msg" id="pmsg">Your message will appear here...</p><p id="pdate"></p></section></div></main><script>const $=x=>document.getElementById(x);function pv(){ $("ptitle").textContent=$("title").value||"Your beautiful surprise";$("pname").textContent=$("recipient").value||"Someone special";$("pmsg").textContent=$("message").value||"Your message will appear here...";$("pdate").textContent=$("date").value?"✦ "+$("date").value:""}["recipient","title","message","date"].forEach(x=>$(x).oninput=pv);async function create(){const body={type:$("type").value,recipient:$("recipient").value,sender:$("sender").value,title:$("title").value,message:$("message").value,date:$("date").value,musicUrl:$("musicUrl").value};if(!body.recipient||!body.title||!body.message)return alert("Please fill recipient, title and message.");const r=await fetch("/api/pages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();$("result").style.display="block";$("result").innerHTML='<b>✨ Your WishingStar is ready!</b><p><a target="_blank" href="'+d.url+'">'+d.url+'</a></p><img class="qr" src="/api/pages/'+d.id+'/qr"><p><a href="/dashboard.html">Manage from Dashboard →</a></p>'}</script>
