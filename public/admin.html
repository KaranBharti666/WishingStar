<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WishingStar Manager Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#fff7fa,#ffeaf1);font-family:Arial,sans-serif;color:#291820;padding:18px;box-sizing:border-box}.card{width:min(420px,100%);background:#fff;padding:28px;border-radius:24px;box-shadow:0 18px 55px #7b304520}h1{margin:0 0 8px}p{color:#765f68;line-height:1.5}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ead6de;border-radius:11px;font:inherit;margin:10px 0}button{width:100%;padding:14px;border:0;border-radius:12px;background:#ff4f81;color:#fff;font-weight:800;cursor:pointer}.error{display:none;color:#a52d48;background:#fff0f0;padding:10px;border-radius:10px;margin-top:10px}</style></head><body><main class="card"><h1>WishingStar ✦</h1><p>Enter your private manager key to access the dashboard and editing tools.</p><input id="key" type="password" autocomplete="current-password" placeholder="Manager key"><button id="login">Continue</button><div id="error" class="error"></div></main><script>
const key=document.getElementById("key"),btn=document.getElementById("login"),err=document.getElementById("error");
async function login(){err.style.display="none";const v=key.value.trim();if(!v){err.textContent="Enter your manager key.";err.style.display="block";return}btn.disabled=true;btn.textContent="Checking…";try{const r=await fetch("/api/pages",{headers:{"X-Admin-Token":v},cache:"no-store"});if(r.status===401){throw Error("Invalid manager key.")}if(!r.ok)throw Error("Manager access is not available right now.");localStorage.setItem("wishingstar_admin_token",v);location.href="/dashboard.html"}catch(e){err.textContent=e.message;err.style.display="block";btn.disabled=false;btn.textContent="Continue"}}
btn.onclick=login;key.addEventListener("keydown",e=>{if(e.key==="Enter")login()});
</script></body></html>
