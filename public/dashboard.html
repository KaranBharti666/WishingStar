<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>WishingStar Dashboard</title><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Playfair+Display:wght@700&family=DM+Sans&display=swap" rel="stylesheet"><style>body{margin:0;background:#fff7fa;font-family:DM Sans;color:#291820;padding:25px}.logo{font:600 32px Caveat;color:#ff4f81}main{max-width:1050px;margin:auto}h1{font:700 40px Playfair Display}.toolbar{display:flex;gap:10px;margin:15px 0}.toolbar input,.toolbar select{padding:12px;border:1px solid #ead6de;border-radius:12px;flex:1}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.item{background:white;padding:18px;border-radius:20px;border:1px solid #efdce3}.tag{color:#bd315c;background:#fff0f5;padding:5px 9px;border-radius:99px;font-size:12px}.actions{margin-top:12px;display:flex;gap:7px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:bold}.primary{background:#ff4f81;color:white}.danger{background:#fff0f0;color:#c33}@media(max-width:700px){.list{grid-template-columns:1fr}.toolbar{flex-direction:column}}</style><body><main><div class="logo">WishingStar ✦</div><h1>My WishingStars</h1><p>Manage your personalised surprises.</p><button class="primary" onclick="location.href='/'">＋ Create new</button><div class="toolbar"><input id="q" placeholder="Search..."><select id="f"><option value="all">All</option><option>birthday</option><option>proposal</option><option>valentine</option><option>anniversary</option><option>custom</option></select></div><section class="list" id="list"></section></main><script>let pages=[];const q=document.getElementById("q"),f=document.getElementById("f");async function load(){pages=await (await fetch("/api/pages")).json();render()}function render(){const x=pages.filter(p=>(f.value=="all"||p.type==f.value)&&((p.title+" "+p.recipient+" "+p.sender).toLowerCase().includes(q.value.toLowerCase())));list.innerHTML=x.length?x.map(p=>'<article class="item"><h3>'+esc(p.title||"Untitled")+'</h3><p>For '+esc(p.recipient||"someone special")+'</p><span class="tag">'+p.type+'</span><div class="actions"><button class="primary" onclick="openPage(\''+p.id+'\')">Open</button><button onclick="qr(\''+p.id+'\')">QR</button><button class="danger" onclick="del(\''+p.id+'\')">Delete</button></div></article>').join(""):'<p>No surprises yet. Create your first one ✨</p>'}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}function openPage(id){window.open("/s/"+id,"_blank")}function qr(id){window.open("/api/pages/"+id+"/qr","_blank")}async function del(id){if(confirm("Delete this surprise?")){await fetch("/api/pages/"+id,{method:"DELETE"});load()}}q.oninput=render;f.onchange=render;load()</script>
