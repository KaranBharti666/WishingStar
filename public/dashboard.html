<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>WishingStar Dashboard</title><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Playfair+Display:wght@700&family=DM+Sans&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#fff7fa;font-family:DM Sans;color:#291820;padding:22px}.wrap{max-width:1100px;margin:auto}.logo{font:600 34px Caveat;color:#ff4f81}.top{display:flex;justify-content:space-between;align-items:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat,.item{background:white;padding:18px;border-radius:20px;border:1px solid #efdce3}.stat b{font:700 28px Playfair Display}.toolbar{display:flex;gap:10px;margin:18px 0}.toolbar input,.toolbar select{padding:12px;border:1px solid #ead6de;border-radius:12px;flex:1}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.responses{margin-top:14px;padding:14px;border-radius:16px;background:#fff8fb;border:1px solid #f1dce4}.response-title{font-weight:800;color:#8f3153;margin-bottom:7px}.response{padding:8px 0;border-top:1px dashed #e8ccd7;font-size:14px;line-height:1.45}.response:first-child{border-top:0}.response time{display:block;color:#a27d88;font-size:11px;margin-top:3px}.tag{color:#bd315c;background:#fff0f5;padding:5px 9px;border-radius:99px;font-size:12px}.thumbs{display:flex;gap:5px;margin-top:10px}.thumbs img{width:55px;height:55px;object-fit:cover;border-radius:10px}.actions{margin-top:12px;display:flex;gap:7px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:bold}.primary{background:#ff4f81;color:white}.danger{background:#fff0f0;color:#c33}.empty{text-align:center;padding:45px}@media(max-width:700px){.list,.stats{grid-template-columns:1fr}.toolbar{flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div class="logo">WishingStar ✦</div><a href="/create.html">＋ Create</a></div><h1>My WishingStars</h1><p>Everything you've created, in one place.</p><section class="stats"><div class="stat"><span>Total</span><br><b id="total">0</b></div><div class="stat"><span>Birthday</span><br><b id="birth">0</b></div><div class="stat"><span>Other</span><br><b id="other">0</b></div></section><div class="toolbar"><input id="q" placeholder="Search recipient, title or sender..."><select id="f"><option value="all">All occasions</option><option value="birthday">Birthday</option><option value="proposal">Proposal</option><option value="valentine">Valentine</option><option value="anniversary">Anniversary</option><option value="custom">Custom</option></select></div><section class="list" id="list"></section></main><script>
let pages=[],loading=false;
const q=document.getElementById("q"),f=document.getElementById("f"),list=document.getElementById("list");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
async function load(){
 if(loading)return; loading=true; list.innerHTML='<div class="empty">Loading your WishingStars…</div>';
 try{
   const r=await fetch("/api/pages",{cache:"no-store"}),j=await r.json();
   if(!r.ok)throw Error(j.error||"Unable to load your WishingStars.");
   pages=Array.isArray(j)?j:[];total.textContent=pages.length;birth.textContent=pages.filter(p=>p.type==="birthday").length;other.textContent=pages.filter(p=>p.type!=="birthday").length;render();
 }catch(e){list.innerHTML='<div class="empty">⚠️ '+esc(e.message||"Could not load your WishingStars.")+'<br><br><button class="primary" id="retry">Retry</button></div>';document.getElementById("retry").onclick=load}
 finally{loading=false}
}
function render(){
 const needle=q.value.trim().toLowerCase(),x=pages.filter(p=>(f.value==="all"||p.type===f.value)&&((p.title||"")+" "+(p.recipient||"")+" "+(p.sender||"")).toLowerCase().includes(needle));
 list.innerHTML=x.length?x.map(p=>{
   const thumbs=Array.isArray(p.photos)?p.photos.slice(0,4).map(u=>'<img src="'+esc(u)+'" alt="Memory" loading="lazy" onerror="this.style.display=\'none\'">').join(""):"";
   return '<article class="item"><h3>'+esc(p.title||"Untitled")+'</h3><p>For <b>'+esc(p.recipient||"someone special")+'</b></p><span class="tag">'+esc(p.type)+'</span>'+(thumbs?'<div class="thumbs">'+thumbs+'</div>':'')+(Array.isArray(p.responses)&&p.responses.length?'<div class="responses"><div class="response-title">💌 Recipient responses</div>'+p.responses.slice().reverse().slice(0,5).map(r=>'<div class="response">'+esc(r.label||r.type)+': <b>'+esc(r.value)+'</b>'+(r.name?' · '+esc(r.name):' · Anonymous')+'<time>'+esc(new Date(r.createdAt).toLocaleString())+'</time></div>').join('')+'</div>':'')+'<div class="actions"><button class="primary" data-action="open" data-id="'+esc(p.id)+'">Open</button><button data-action="edit" data-id="'+esc(p.id)+'">Edit</button><button data-action="qr" data-id="'+esc(p.id)+'">QR</button><button class="danger" data-action="delete" data-id="'+esc(p.id)+'">Delete</button></div></article>'
 }).join(""):'<div class="empty">✨ No surprises yet.<br><br><a href="/create.html">Create your first WishingStar</a></div>';
}
list.addEventListener("click",async e=>{
 const b=e.target.closest("button[data-action]");if(!b)return;const id=b.dataset.id,action=b.dataset.action;
 if(!id)return;
 if(action==="open")window.open("/s/"+encodeURIComponent(id),"_blank");
 else if(action==="edit")location.href="/create.html?edit="+encodeURIComponent(id);
 else if(action==="qr")window.open("/api/pages/"+encodeURIComponent(id)+"/qr","_blank");
 else if(action==="delete"){
   if(!confirm("Delete this surprise permanently?"))return;
   b.disabled=true;b.textContent="Deleting…";
   try{const r=await fetch("/api/pages/"+encodeURIComponent(id),{method:"DELETE"});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||"Delete failed.");pages=pages.filter(p=>p.id!==id);total.textContent=pages.length;birth.textContent=pages.filter(p=>p.type==="birthday").length;other.textContent=pages.filter(p=>p.type!=="birthday").length;render()}catch(err){alert(err.message||"Could not delete this surprise.");b.disabled=false;b.textContent="Delete"}
 }
});
q.oninput=render;f.onchange=render;load();
</script></body></html>
