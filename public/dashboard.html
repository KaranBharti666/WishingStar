<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>WishingStar Dashboard</title><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Playfair+Display:wght@700&family=DM+Sans&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#fff7fa;font-family:DM Sans;color:#291820;padding:22px}.wrap{max-width:1100px;margin:auto}.logo{font:600 34px Caveat;color:#ff4f81}.top{display:flex;justify-content:space-between;align-items:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat,.item{background:white;padding:18px;border-radius:20px;border:1px solid #efdce3}.stat b{font:700 28px Playfair Display}.toolbar{display:flex;gap:10px;margin:18px 0}.toolbar input,.toolbar select{padding:12px;border:1px solid #ead6de;border-radius:12px;flex:1}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.tag{color:#bd315c;background:#fff0f5;padding:5px 9px;border-radius:99px;font-size:12px}.thumbs{display:flex;gap:5px;margin-top:10px}.thumbs img{width:55px;height:55px;object-fit:cover;border-radius:10px}.actions{margin-top:12px;display:flex;gap:7px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:bold}.primary{background:#ff4f81;color:white}.danger{background:#fff0f0;color:#c33}.empty{text-align:center;padding:45px}@media(max-width:700px){.list,.stats{grid-template-columns:1fr}.toolbar{flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div class="logo">WishingStar ✦</div><a href="/">＋ Create</a></div><h1>My WishingStars</h1><p>Everything you've created, in one place.</p><section class="stats"><div class="stat"><span>Total</span><br><b id="total">0</b></div><div class="stat"><span>Birthday</span><br><b id="birth">0</b></div><div class="stat"><span>Other</span><br><b id="other">0</b></div></section><div class="toolbar"><input id="q" placeholder="Search recipient, title or sender..."><select id="f"><option value="all">All occasions</option><option value="birthday">Birthday</option><option value="proposal">Proposal</option><option value="valentine">Valentine</option><option value="anniversary">Anniversary</option><option value="custom">Custom</option></select></div><section class="list" id="list"></section></main><script>let pages=[];const q=document.getElementById("q"),f=document.getElementById("f");async function load(){pages=await(await fetch("/api/pages")).json();total.textContent=pages.length;birth.textContent=pages.filter(p=>p.type==="birthday").length;other.textContent=pages.filter(p=>p.type!=="birthday").length;render()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}function render(){const x=pages.filter(p=>(f.value==="all"||p.type===f.value)&&((p.title+" "+p.recipient+" "+p.sender).toLowerCase().includes(q.value.toLowerCase())));list.innerHTML=x.length?x.map(p=>'<article class="item"><h3>'+esc(p.title||"Untitled")+'</h3><p>For <b>'+esc(p.recipient||"someone special")+'</b></p><span class="tag">'+p.type+'</span>'+(p.photos?.length?'<div class="thumbs">'+p.photos.slice(0,4).map(x=>'<img src="'+x+'">').join("")+'</div>':'')+'<div class="actions"><button class="primary" onclick="openPage(\''+p.id+'\')">Open</button><button onclick="edit(\''+p.id+'\')">Edit</button><button onclick="qr(\''+p.id+'\')">QR</button><button class="danger" onclick="del(\''+p.id+'\')">Delete</button></div></article>').join(""):'<div class="empty">✨ No surprises yet.<br><br><a href="/">Create your first WishingStar</a></div>'}function openPage(id){window.open("/s/"+id,"_blank")}function edit(id){location.href="/?edit="+id}function qr(id){window.open("/api/pages/"+id+"/qr","_blank")}async function del(id){if(confirm("Delete this surprise permanently?")){await fetch("/api/pages/"+id,{method:"DELETE"});load()}}q.oninput=render;f.onchange=render;load()</script></body></html>
