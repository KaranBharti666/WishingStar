<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>WishingStar Dashboard</title><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Playfair+Display:wght@700&family=DM+Sans&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}:root{--pink:#ff4f81;--ink:#291820;--muted:#78636c;--line:#efdce5}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 5%,#fff 0 18%,transparent 38%),radial-gradient(circle at 95% 12%,#ffe0eb 0 15%,transparent 36%),linear-gradient(145deg,#fff8fb,#fff0f5 55%,#f7f1ff);font-family:"DM Sans",sans-serif;color:var(--ink);padding:14px}
body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(2px);opacity:.4;pointer-events:none}body:before{width:240px;height:240px;left:-130px;top:55%;background:#ffd5e4}body:after{width:260px;height:260px;right:-140px;bottom:5%;background:#e8ddff}
.wrap{width:min(1120px,100%);margin:auto}.top{position:sticky;top:8px;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#ffffffd9;border:1px solid #fff;border-radius:18px;box-shadow:0 12px 35px #712f4810;backdrop-filter:blur(16px)}
.logo{font:600 36px Caveat;color:var(--pink);text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:.2s}.logo:hover{transform:translateY(-1px)}.create{color:#fff;background:linear-gradient(90deg,#ff4f81,#f56d99);padding:10px 15px;border-radius:999px;text-decoration:none;font-weight:800;font-size:13px;box-shadow:0 8px 18px #ff4f8130}
.hero{padding:38px 4px 25px}.eyebrow{display:inline-block;background:#fff;border:1px solid #f1dce4;color:#b24869;padding:7px 11px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:1px}.hero h1{font:700 clamp(38px,5vw,56px)/1.05 "Playfair Display";margin:12px 0 8px;letter-spacing:-1px}.hero h1 span{color:var(--pink)}.hero p{margin:0;color:var(--muted);font-size:15px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:22px}.stat{background:#fffffff2;padding:18px 19px;border-radius:22px;border:1px solid #fff;box-shadow:0 14px 35px #71304b10;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-22px;top:-25px;background:#ffe0e9}.stat .icon{font-size:22px;position:relative;z-index:1}.stat span{display:block;color:#856d76;font-size:12px;margin-top:7px}.stat b{font:700 30px "Playfair Display";position:relative;z-index:1}
.toolbar{display:flex;gap:10px;margin:0 0 17px;align-items:center}.search{position:relative;flex:1}.search span{position:absolute;left:13px;top:11px}.toolbar input,.toolbar select{width:100%;padding:12px 13px 12px 38px;border:1px solid #ead6de;border-radius:13px;background:#ffffffd9;font:inherit;color:var(--ink);outline:0}.toolbar select{padding-left:13px;width:190px}.toolbar input:focus,.toolbar select:focus{border-color:#ff8ead;box-shadow:0 0 0 4px #ff7fa41a}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.item{background:#fffffff2;padding:19px;border-radius:24px;border:1px solid #fff;box-shadow:0 17px 45px #71304b10;position:relative;overflow:hidden}.item:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#ff7fa4,#e8a7ff,#ffd0df)}.item h3{font:700 21px "Playfair Display";margin:1px 0 7px}.item p{margin:0 0 9px;color:#7c6870;font-size:13px}.tag{display:inline-block;color:#b6335e;background:#fff0f5;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:700;text-transform:capitalize}.thumbs{display:flex;gap:6px;margin-top:12px}.thumbs img{width:58px;height:58px;object-fit:cover;border-radius:11px;border:2px solid #fff;box-shadow:0 4px 12px #0001}.responses{margin-top:13px;padding:13px;border-radius:16px;background:#fff8fb;border:1px solid #f1dce4}.response-title{font-weight:800;color:#8f3153;margin-bottom:7px;font-size:13px}.response{padding:8px 0;border-top:1px dashed #e8ccd7;font-size:13px;line-height:1.45}.response:first-child{border-top:0}.response time{display:block;color:#a27d88;font-size:10px;margin-top:3px}.actions{margin-top:14px;display:flex;gap:7px;flex-wrap:wrap}button{border:1px solid #ecdce2;border-radius:11px;padding:9px 12px;cursor:pointer;font-weight:800;background:#fff;color:#6e4e5a;transition:.18s}button:hover{transform:translateY(-1px);box-shadow:0 6px 14px #71304b0e}.primary{background:#ff4f81;border-color:#ff4f81;color:white}.danger{background:#fff0f0;border-color:#ffd9df;color:#c33}.empty{text-align:center;padding:55px 20px;background:#fffffff2;border:1px solid #fff;border-radius:24px;color:#806c74;box-shadow:0 14px 35px #71304b0b}.empty a{color:#c13c68;font-weight:800;text-decoration:none}
@media(max-width:700px){body{padding:9px}.top{top:5px}.logo{font-size:34px}.create{font-size:12px;padding:9px 12px}.hero{padding:29px 4px 22px}.hero h1{font-size:40px}.hero p{font-size:14px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.toolbar{flex-direction:column;align-items:stretch}.toolbar select{width:100%}.list{grid-template-columns:1fr}.item{border-radius:21px}}
@media(max-width:390px){.logo{font-size:31px}.hero h1{font-size:35px}.stats{gap:8px}.stat{padding:15px}.stat b{font-size:26px}}

@media(prefers-color-scheme:dark){
 body{background:radial-gradient(circle at 8% 5%,#33202a 0 18%,transparent 38%),radial-gradient(circle at 95% 12%,#30243e 0 15%,transparent 36%),linear-gradient(145deg,#120d12,#1d1319 55%,#171328);color:#f7eaf0}
 .top{background:#1c151bee;border-color:#3d2c35;box-shadow:0 12px 35px #0006}.hero h1{color:#fff0f5}.hero p{color:#c6afb8}.eyebrow{background:#281921;border-color:#503540;color:#ffabc3}
 .stat,.item,.empty{background:#1c1519f2;border-color:#3e2d35;box-shadow:0 17px 45px #0006}.stat span,.item p{color:#bfa8b1}.stat:after{background:#3a202b}.tag{background:#311c26;color:#ff9fba}
 .toolbar input,.toolbar select{background:#241a20;color:#f7eaf0;border-color:#49343e;color-scheme:dark}.responses{background:#21171d;border-color:#49343e}.response{border-color:#4b3540}.response time{color:#a88c98}.empty a{color:#ff9fba}
 button{background:#241a20;color:#efd8e1;border-color:#4a3540}.danger{background:#351d23;color:#ffabb8;border-color:#5d3039}
}
html{-webkit-text-size-adjust:100%;}

/* WishingStar touch feedback: remove Android/Chrome's default tap square and use our own */
html,body,*{
  -webkit-tap-highlight-color:transparent;
}
button,a,[role="button"],input,textarea,select{
  -webkit-tap-highlight-color:transparent;
}
button:focus:not(:focus-visible),
a:focus:not(:focus-visible),
input:focus:not(:focus-visible),
textarea:focus:not(:focus-visible),
select:focus:not(:focus-visible){
  outline:none;
}
.wishing-click{
  position:fixed;z-index:99999;width:20px;height:20px;margin:-10px 0 0 -10px;
  border-radius:50%;pointer-events:none;border:2px solid rgba(255,79,129,.72);
  background:rgba(255,159,190,.18);box-shadow:0 0 0 0 rgba(255,79,129,.25);
  transform:scale(.35);animation:wishingClick .48s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes wishingClick{
  0%{opacity:.95;transform:scale(.35)}
  55%{opacity:.65}
  100%{opacity:0;transform:scale(2.35);box-shadow:0 0 0 10px rgba(255,79,129,0)}
}
</style></head><body><main class="wrap"><div class="top"><a class="logo" href="/" aria-label="WishingStar home">WishingStar <span>✦</span></a><a class="create" href="/create.html">＋ Create Surprise</a></div><section class="hero"><span class="eyebrow">YOUR LITTLE SURPRISE SPACE ✦</span><h1>All your <span>WishingStars</span> in one place.</h1><p>Create, edit, share and keep track of every little surprise you make. 💗</p></section><section class="stats"><div class="stat"><div class="icon">✨</div><span>Total surprises</span><b id="total">0</b></div><div class="stat"><div class="icon">🎂</div><span>Birthday surprises</span><b id="birth">0</b></div><div class="stat"><div class="icon">💗</div><span>Other occasions</span><b id="other">0</b></div></section><div class="toolbar"><div class="search"><span>🔎</span><input id="q" placeholder="Search recipient, title or sender..."></div><select id="f"><option value="all">All occasions</option><option value="birthday">Birthday</option><option value="proposal">Proposal</option><option value="valentine">Valentine</option><option value="anniversary">Anniversary</option><option value="custom">Custom</option></select></div><section class="list" id="list"></section></main><script>
let pages=[],loading=false;
const DASH_STORE="wishingstar_dashboard_v2";
const deviceToken=()=>{let t=localStorage.getItem("wishingstar_device_id");if(!t){const b=new Uint8Array(32);crypto.getRandomValues(b);t=Array.from(b,x=>x.toString(16).padStart(2,"0")).join("");localStorage.setItem("wishingstar_device_id",t);}return t;};
const q=document.getElementById("q"),f=document.getElementById("f"),list=document.getElementById("list");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
function readDashboard(){try{const x=JSON.parse(localStorage.getItem(DASH_STORE)||"[]");return Array.isArray(x)?x.filter(p=>p&&p.id):[]}catch{return[]}}
function writeDashboard(x){try{localStorage.setItem(DASH_STORE,JSON.stringify(x))}catch{}}
function cachePage(p){
 if(!p||!p.id)return;
 const all=readDashboard(),i=all.findIndex(x=>x.id===p.id),prev=i>=0?all[i]:{};
 const row={...prev,...p,id:String(p.id),photos:Array.isArray(p.photos)?p.photos.slice(0,4):(prev.photos||[]),responses:Array.isArray(p.responses)?p.responses.slice(-200):(prev.responses||[])};
 if(!row.createdAt)row.createdAt=new Date().toISOString();
 row.updatedAt=p.updatedAt||prev.updatedAt||row.createdAt;
 if(i>=0)all[i]=row;else all.push(row);
 all.sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||"")));
 writeDashboard(all);pages=all;
}
function removeCachedPage(id){const all=readDashboard().filter(p=>p.id!==id);writeDashboard(all);pages=all}
function updateStats(){total.textContent=pages.length;birth.textContent=pages.filter(p=>p.type==="birthday").length;other.textContent=pages.filter(p=>p.type!=="birthday").length}
async function syncResponses(){
 const current=readDashboard();
 if(!current.length)return;
 const results=await Promise.all(current.map(async p=>{
   try{
     const r=await fetch("/api/pages/"+encodeURIComponent(p.id),{cache:"no-store"});
     if(!r.ok)return p;
     const remote=await r.json();
     return {...p,responses:Array.isArray(remote.responses)?remote.responses.slice(-200):[]};
   }catch{return p}
 }));
 writeDashboard(results);pages=results;updateStats();render();
}
async function load(){
 if(loading)return;
 loading=true;
 const cached=readDashboard();
 if(cached.length){
   pages=cached;updateStats();render();loading=false;
   syncResponses();
   return;
 }
 list.innerHTML='<div class="empty">Loading your WishingStars…</div>';
 try{
   const r=await fetch("/api/pages",{cache:"no-store",headers:{"X-Device-Token":deviceToken()}});
   const j=await r.json();
   if(!r.ok)throw Error(j.error||"Unable to load your WishingStars.");
   pages=Array.isArray(j)?j:[];
   writeDashboard(pages);
   updateStats();render();
 }catch(e){
   list.innerHTML='<div class="empty">⚠️ '+esc(e.message||"Could not load your WishingStars.")+'<br><br><button class="primary" id="retry">Retry</button></div>';
   document.getElementById("retry").onclick=load;
 }finally{loading=false}
}
function render(){
 const needle=q.value.trim().toLowerCase(),x=pages.filter(p=>(f.value==="all"||p.type===f.value)&&((p.title||"")+" "+(p.recipient||"")+" "+(p.sender||"")).toLowerCase().includes(needle));
 list.innerHTML=x.length?x.map(p=>{
   const thumbs=Array.isArray(p.photos)?p.photos.slice(0,4).map(u=>'<img src="'+esc(u)+'" alt="Memory" loading="lazy" onerror="this.style.display=\'none\'">').join(""):"";
   return '<article class="item"><h3>'+esc(p.title||"Untitled")+'</h3><p>For <b>'+esc(p.recipient||"someone special")+'</b></p><span class="tag">'+esc(p.type)+'</span>'+(thumbs?'<div class="thumbs">'+thumbs+'</div>':'')+(Array.isArray(p.responses)&&p.responses.length?'<div class="responses"><div class="response-title">💌 Recipient responses</div>'+p.responses.slice().reverse().slice(0,5).map(r=>'<div class="response">'+esc(r.label||r.type)+': <b>'+esc(r.value)+'</b>'+(r.name?' · '+esc(r.name):' · Anonymous')+'<time>'+esc(new Date(r.createdAt).toLocaleString())+'</time></div>').join('')+'</div>':'')+'<div class="actions"><button class="primary" data-action="open" data-id="'+esc(p.id)+'">Open</button><button data-action="edit" data-id="'+esc(p.id)+'">Edit</button><button data-action="qr" data-id="'+esc(p.id)+'">QR</button><button class="danger" data-action="delete" data-id="'+esc(p.id)+'">Delete</button></div></article>'
 }).join(""):'<div class="empty">✨ No surprises yet.<br><br><a href="/create.html">Create your first WishingStar</a></div>';
}
list.addEventListener("click",async e=>{
 const b=e.target.closest("button[data-action]");if(!b)return;const id=b.dataset.id,action=b.dataset.action;
 if(!id)return;
 if(action==="open")window.open("/s/"+encodeURIComponent(id),"_blank");
 else if(action==="edit")location.href="/create.html?edit="+encodeURIComponent(id);
 else if(action==="qr")window.open("/api/pages/"+encodeURIComponent(id)+"/qr","_blank");
 else if(action==="delete"){
   if(!confirm("Delete this surprise permanently?"))return;
   b.disabled=true;b.textContent="Deleting…";
   try{
     const r=await fetch("/api/pages/"+encodeURIComponent(id),{method:"DELETE",headers:{"X-Device-Token":deviceToken()}});
     const j=await r.json().catch(()=>({}));
     if(!r.ok)throw Error(j.error||"Delete failed.");
     removeCachedPage(id);updateStats();render();
   }catch(err){alert(err.message||"Could not delete this surprise.");b.disabled=false;b.textContent="Delete"}
 }
});
q.oninput=render;f.onchange=render;load();
/* Custom tap feedback replaces the browser's blue tap highlight. */
document.addEventListener("click",function(e){
  if(e.defaultPrevented)return;
  const x=e.clientX,y=e.clientY;
  if(!Number.isFinite(x)||!Number.isFinite(y))return;
  const r=document.createElement("span");
  r.className="wishing-click";r.style.left=x+"px";r.style.top=y+"px";
  document.body.appendChild(r);setTimeout(()=>r.remove(),520);
},{passive:true});
</script></body></html>
